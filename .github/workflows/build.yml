name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-policy:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.policy.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          fetch-depth: 0
      - name: Validate release tag and source branch
        id: policy
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: bash scripts/release-policy.sh "$RELEASE_TAG" "$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
  test:
    needs: release-policy
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make build test lint
      - if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - if: runner.os == 'Linux'
        run: cd web && npm audit --audit-level=high
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/integration.py
      - run: cd web && npx playwright install --with-deps chromium && npm run test:e2e
      - if: runner.os == 'Linux'
        run: python3 scripts/docker-integration.py
  binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build distributions
        run: |
          VERSION="${GITHUB_SHA::8}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          make dist VERSION="$VERSION"
          mkdir -p dist/release
          for binary in dist/stakl-*; do
            name="$(basename "$binary")"
            tar -czf "dist/release/$name.tar.gz" -C dist "$name"
          done
          cd dist/release
          sha256sum ./*.tar.gz > checksums.txt
          cp ../../install.sh .
      - name: Smoke-test installer
        run: |
          install_dir="$(mktemp -d)"
          python3 -m http.server 48080 --directory dist/release >/tmp/stakl-installer-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; rm -rf "$install_dir"' EXIT
          STAKL_RELEASE_URL=http://127.0.0.1:48080 STAKL_INSTALL_DIR="$install_dir" sh ./install.sh
          "$install_dir/stakl" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stakl-binaries
          path: dist/release/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, release-policy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: stakl-binaries
          path: release
      - name: Prepare GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.release-policy.outputs.prerelease }}
        run: |
          release_args=(--repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Stakl $GITHUB_REF_NAME")
          if [[ "$PRERELEASE" == true ]]; then
            release_args+=(--prerelease --latest=false)
          else
            release_args+=(--draft)
          fi
          gh release create "$GITHUB_REF_NAME" release/* "${release_args[@]}"
