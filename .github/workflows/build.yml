name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make build test lint
      - if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - if: runner.os == 'Linux'
        run: cd web && npm audit --audit-level=high
      - run: python3 scripts/integration.py
      - run: cd web && npx playwright install --with-deps chromium && npm run test:e2e
      - if: runner.os == 'Linux'
        run: python3 scripts/docker-integration.py
  binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build distributions
        run: |
          VERSION="${GITHUB_SHA::8}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          make dist VERSION="$VERSION"
          mkdir -p dist/release
          for binary in dist/localdesk-*; do
            name="$(basename "$binary")"
            tar -czf "dist/release/$name.tar.gz" -C dist "$name"
          done
          cd dist/release
          sha256sum ./*.tar.gz > checksums.txt
          cp ../../install.sh .
      - name: Smoke-test installer
        run: |
          install_dir="$(mktemp -d)"
          python3 -m http.server 48080 --directory dist/release >/tmp/localdesk-installer-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; rm -rf "$install_dir"' EXIT
          LOCALDESK_RELEASE_URL=http://127.0.0.1:48080 LOCALDESK_INSTALL_DIR="$install_dir" sh ./install.sh
          "$install_dir/localdesk" --version
      - uses: actions/upload-artifact@v4
        with:
          name: localdesk-binaries
          path: dist/release/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: localdesk-binaries
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "LocalDesk $GITHUB_REF_NAME"
