name: Feature request
description: Suggest an improvement to Stakl.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the task or workflow that is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the behavior you would find useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include workarounds or other approaches, if any.
